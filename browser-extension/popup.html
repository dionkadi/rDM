<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DM Grabber</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1d24;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #0f8a63;
        --danger: #c9344a;
        --success: #1d8a55;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181c28;
          --fg: #e9e7e2;
          --muted: #9aa1b1;
          --border: #2a2f3a;
          --accent: #7af0c8;
          --danger: #ff7a8f;
          --success: #74e0a4;
        }
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        background: var(--bg);
        color: var(--fg);
      }
      h3 {
        margin: 0 0 4px;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h3 .logo {
        width: 18px;
        height: 18px;
        background: linear-gradient(135deg, var(--accent), #46c8a0);
        border-radius: 5px;
        display: inline-block;
      }
      p.lead {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        margin-top: 8px;
        cursor: pointer;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        transition: all 0.15s;
      }
      button:hover { background: rgba(0, 0, 0, 0.04); }
      button.primary {
        background: var(--accent);
        color: #ffffff;
        border-color: transparent;
        font-weight: 600;
      }
      button.primary:hover { filter: brightness(1.1); }
      #status {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 10px;
        min-height: 14px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      #status.ok { color: var(--success); }
      #status.err { color: var(--danger); }
      code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        background: rgba(0, 0, 0, 0.06);
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h3><span class="logo"></span>DM Grabber</h3>
    <p class="lead">Send media links from this page to DM.</p>
    <button id="grab" class="primary">Grab page media</button>
    <button id="open">Open DM app</button>
    <p id="status">Checking…</p>
    <script src="popup.js"></script>
  </body>
</html>
