[package]
name = "dm-tauri"
version = "0.2.1"
description = "DM - a cross-platform download manager (IDM-style) built with Tauri + Rust"
edition = "2021"
default-run = "dm-tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dm-engine = { path = "../crates/engine" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
chrono = { version = "0.4", features = ["clock"] }

[features]
# By default Tauri opens a window; this keeps the bundle self-contained.
default = []
