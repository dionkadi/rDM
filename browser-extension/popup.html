<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DM Grabber</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1d24;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #0f8a63;
        --danger: #c9344a;
        --success: #1d8a55;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181c28;
          --fg: #e9e7e2;
          --muted: #9aa1b1;
          --border: #2a2f3a;
          --accent: #7af0c8;
          --danger: #ff7a8f;
          --success: #74e0a4;
        }
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        background: var(--bg);
        color: var(--fg);
      }
      h3 {
        margin: 0 0 4px;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .err-detail {
        display: none;
        margin-top: 8px;
        padding: 8px 10px;
        background: rgba(255, 122, 143, 0.12);
        border: 1px solid rgba(255, 122, 143, 0.4);
        border-radius: 6px;
        color: var(--danger);
        font-size: 11.5px;
        line-height: 1.45;
        word-break: break-word;
      }
      .err-detail.shown {
        display: block;
      }
      .err-detail code {
        color: inherit;
        background: rgba(0, 0, 0, 0.08);
      }
      .err-detail .hint {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
      }
      h3 .logo {
        width: 18px;
        height: 18px;
        background: linear-gradient(135deg, var(--accent), #46c8a0);
        border-radius: 5px;
        display: inline-block;
      }
      p.lead {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        margin-top: 8px;
        cursor: pointer;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        transition: all 0.15s;
      }
      button:hover {
        background: rgba(0, 0, 0, 0.04);
      }
      button.primary {
        background: var(--accent);
        color: #ffffff;
        border-color: transparent;
        font-weight: 600;
      }
      button.primary:hover {
        filter: brightness(1.1);
      }
      #status {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 10px;
        min-height: 14px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      #status.ok {
        color: var(--success);
      }
      #status.err {
        color: var(--danger);
      }
      #status.warn {
        color: #a8620a;
      }
      fieldset.options {
        margin: 12px 0 0;
        padding: 8px 10px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      fieldset.options legend {
        padding: 0 4px;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      label.opt {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        font-size: 11.5px;
        line-height: 1.4;
        margin-top: 7px;
        cursor: pointer;
      }
      label.opt input {
        margin: 1px 0 0;
        flex: none;
      }
      label.opt .why {
        display: block;
        color: var(--muted);
        font-size: 10.5px;
      }
      code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        background: rgba(0, 0, 0, 0.06);
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h3><span class="logo"></span>DM Grabber</h3>
    <p class="lead">Send media links from this page to DM.</p>
    <button id="grab" class="primary">Grab page media</button>
    <button id="open">Re-check host</button>
    <button
      id="test"
      style="font-size: 11.5px; padding: 6px 10px; margin-top: 6px"
    >
      Test host connection
    </button>
    <fieldset class="options">
      <legend>Behaviour</legend>
      <label class="opt">
        <input type="checkbox" id="opt-click" />
        <span>
          Take over media link clicks
          <span class="why">Clicks on .zip/.pdf/.mp4-style links go to DM.</span>
        </span>
      </label>
      <label class="opt">
        <input type="checkbox" id="opt-takeover" />
        <span>
          Take over all browser downloads
          <span class="why"
            >Also cancels downloads DM didn't receive a click for (Save
            link as, Ctrl-click).</span
          >
        </span>
      </label>
    </fieldset>
    <p id="status">Checking…</p>
    <div id="err-detail" class="err-detail"></div>
    <script src="popup.js"></script>
  </body>
</html>
