<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DM Grabber</title>
    <style>
      /* Instrument language, same tokens as the app (docs/UI_DESIGN_PLAN.md).
         Flat surfaces, hairlines, one accent, sentence case. */
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --panel: #ffffff;
        --fg: #1b1e24;
        --muted: #5f6673;
        --faint: #676e7c;
        --border: rgba(17, 20, 26, 0.1);
        --border-2: rgba(17, 20, 26, 0.06);
        --accent: #0d7a5e;
        --accent-dim: rgba(13, 122, 94, 0.1);
        --danger: #c0392f;
        --danger-dim: rgba(192, 57, 47, 0.1);
        --success: #1d7a4e;
        --warning: #a26a00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191e;
          --panel: #1e2128;
          --fg: #e6e8eb;
          --muted: #9ba1ab;
          --faint: #8c95a4;
          --border: rgba(255, 255, 255, 0.08);
          --border-2: rgba(255, 255, 255, 0.05);
          --accent: #41c9a2;
          --accent-dim: rgba(65, 201, 162, 0.12);
          --danger: #e5716a;
          --danger-dim: rgba(229, 113, 106, 0.12);
          --success: #54c68f;
          --warning: #dfa84e;
        }
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Noto Sans SC",
          "PingFang SC",
          sans-serif;
        width: 300px;
        margin: 0;
        padding: 12px 12px 10px;
        background: var(--bg);
        color: var(--fg);
        font-size: 12px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .host-state {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .host-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
        flex: none;
      }
      .host-dot.ok { background: var(--success); }
      .host-dot.err { background: var(--danger); }
      .host-dot.checking { background: var(--faint); }
      h3 .logo {
        width: 18px;
        height: 18px;
        background: var(--accent);
        border-radius: 5px;
        display: grid;
        place-items: center;
        color: var(--bg);
        flex: none;
      }
      h3 .logo svg {
        width: 11px;
        height: 11px;
      }
      /* The host state lives in the title row as a dot + label; this is
         its one line of detail. Long diagnostics are ellipsised visually
         and kept in full in the `title` (and in #err-detail below). */
      #status {
        color: var(--muted);
        font-size: 11px;
        margin: 7px 0 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border-2);
        min-height: 13px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      button {
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        border-radius: 6px;
        transition:
          background 0.12s,
          border-color 0.12s;
      }
      button.primary {
        width: 100%;
        padding: 8px 12px;
        background: var(--accent);
        color: var(--bg);
        border: 1px solid transparent;
        font-weight: 600;
      }
      button.primary:hover {
        filter: brightness(1.08);
      }
      .link-row {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .link-row button {
        flex: 1;
        padding: 5px 8px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .link-row button:hover {
        color: var(--fg);
        border-color: var(--muted);
      }
      .toggles {
        margin-top: 10px;
        border-top: 1px solid var(--border-2);
        padding-top: 8px;
        display: grid;
        gap: 7px;
      }
      label.opt {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        font-size: 11px;
        line-height: 1.35;
        cursor: pointer;
      }
      label.opt input {
        margin: 2px 0 0;
        flex: none;
        accent-color: var(--accent);
      }
      label.opt .why {
        display: block;
        color: var(--faint);
        font-size: 11px;
      }
      #status.ok { color: var(--success); }
      #status.err { color: var(--danger); }
      #status.warn { color: var(--warning); }
      .err-detail {
        display: none;
        margin: 0 0 10px;
        padding: 7px 9px;
        background: var(--danger-dim);
        border: 1px solid var(--danger);
        border-radius: 6px;
        color: var(--danger);
        font-size: 11px;
        line-height: 1.45;
        word-break: break-word;
      }
      .err-detail.shown {
        display: block;
      }
      .err-detail code {
        color: inherit;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
      }
      .err-detail .hint {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <h3><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v9m0 0l-3.4-3.4M12 13l3.4-3.4"/><path d="M5 19h14"/></svg></span>DM Grabber</h3>
      <span
        id="host-state"
        class="host-state"
        role="group"
        aria-label="Host connection status"
        aria-describedby="status"
        title="Checking host connection"
      >
        <span id="host-dot" class="host-dot checking" aria-hidden="true"></span>
        <span id="host-label">Checking…</span>
      </span>
    </div>
    <!-- The ellipsised line keeps its full text in `title` and is
         focusable so keyboard/AT users can read it without hovering. -->
    <p id="status" tabindex="0" title="Checking…">Checking…</p>
    <div id="err-detail" class="err-detail"></div>
    <button id="grab" class="primary">Grab page media</button>
    <div class="link-row">
      <button id="open">Re-check host</button>
      <button id="test">Test host connection</button>
    </div>
    <div class="toggles">
      <label class="opt">
        <input type="checkbox" id="opt-click" />
        <span>
          Take over media link clicks
          <span class="why">Clicks on .zip/.pdf/.mp4-style links go to DM.</span>
        </span>
      </label>
      <label class="opt">
        <input type="checkbox" id="opt-takeover" />
        <span>
          Take over all browser downloads
          <span class="why">Also cancels downloads DM didn't receive a click for.</span>
        </span>
      </label>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
