[package]
name = "dm-native-host"
version = "0.2.1"
edition = "2021"
description = "Native-messaging host that forwards browser-captured URLs/video links to DM"
publish = false

[[bin]]
name = "dm-native-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
